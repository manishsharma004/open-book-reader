<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				try {
					var mode = localStorage.getItem('obr-theme') || 'system';
					var dark =
						mode === 'night' ||
						(mode !== 'day' && matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) document.documentElement.classList.add('dark');
					var names = { ink: 1, lamp: 1, moss: 1, tide: 1, dusk: 1 };
					var stored = localStorage.getItem('obr-palette');
					var palette = names[stored] ? stored : 'ink';
					document.documentElement.setAttribute('data-palette', palette);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
